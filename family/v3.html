<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家庭保障故事工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   0. 設計 TOKEN — 淺色（設定/選情境）與深色（故事模式）共用暖金色系
   ========================================================================== */
:root{
  --font-tc: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-num: "Space Grotesk", "Noto Sans TC", -apple-system, ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* 淺色（駕駛艙） */
  --paper: #f3f5f8;
  --paper-raised: #ffffff;
  --ink: #131a2c;
  --ink-soft: #4b5468;
  --line: #dde2ec;
  --line-strong: #c3cadb;
  --accent-gold: #c9822f;
  --accent-gold-soft: #f3ddb8;
  --accent-rose: #c2645f;
  --focus: #33507a;

  /* 深色（故事） */
  --night-0: #060a16;
  --night-1: #0b1330;
  --night-2: #121d42;
  --night-3: #1a2957;
  --night-line: #26355f;
  --night-ink: #eef1f8;
  --night-ink-soft: #9aa6c4;
  --warm-candle: #f2b565;
  --warm-candle-soft: #ffe3b0;
  --warm-ember: #e2735f;

  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 26px;
  --shadow-soft: 0 8px 24px rgba(19,26,44,0.08);
  --shadow-night: 0 20px 60px rgba(0,0,0,0.45);
  --dur: 420ms;
  --ease: cubic-bezier(.22,.8,.28,1);
}
@media (prefers-reduced-motion: reduce){
  :root{ --dur: 1ms; }
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font-tc);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{ font-family:inherit; }
::selection{ background:var(--accent-gold-soft); }
.num{ font-family:var(--font-num); font-variant-numeric:tabular-nums; font-weight:600; }
input[type="range"]{ -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; touch-action:none; }
input[type="range"]::-webkit-slider-runnable-track{ height:8px; border-radius:99px; background:var(--line-strong); }
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:28px; height:28px; margin-top:-10px;
  border-radius:50%; background:var(--accent-gold); border:4px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;
}
input[type="range"]::-moz-range-track{ height:8px; border-radius:99px; background:var(--line-strong); }
input[type="range"]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--accent-gold); border:4px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer; }
.dark input[type="range"]::-webkit-slider-runnable-track{ background:var(--night-line); }
.dark input[type="range"]::-webkit-slider-thumb{ background:var(--warm-candle); border-color:var(--night-1); }
.dark input[type="range"]::-moz-range-thumb{ background:var(--warm-candle); border-color:var(--night-1); }

/* ==========================================================================
   1. 版面骨架
   ========================================================================== */
#app{ min-height:100vh; position:relative; }
.stage{ display:none; min-height:100vh; }
.stage.active{ display:block; }
.stage--light{ background:var(--paper); color:var(--ink); }
.stage--dark{ background:var(--night-0); color:var(--night-ink); }

.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 18px; background:rgba(243,245,248,0.9); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:.02em; }
.iconbtn{
  min-width:44px; min-height:44px; border-radius:99px; border:1px solid var(--line-strong);
  background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .15s var(--ease), background .15s;
}
.iconbtn:active{ transform:scale(.93); }
.iconbtn svg{ width:20px; height:20px; }

.wrap{ max-width:820px; margin:0 auto; padding:18px 16px 140px; }

/* ==========================================================================
   2. 階段一：客戶背景設定（駕駛艙）
   ========================================================================== */
.field{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px 16px 18px; margin-bottom:14px; box-shadow:var(--shadow-soft);
}
.field h2{ font-size:14px; margin:0 0 4px; color:var(--ink-soft); font-weight:700; display:flex; align-items:center; gap:8px; }
.field h2 .tag{ font-size:11px; padding:2px 8px; border-radius:99px; background:var(--accent-gold-soft); color:#7a5316; font-weight:700; }
.field .value-row{ display:flex; align-items:baseline; gap:6px; margin:2px 0 10px; }
.field .value-row .big{ font-size:28px; font-family:var(--font-num); font-weight:700; color:var(--ink); }
.field .value-row .unit{ font-size:13px; color:var(--ink-soft); }

.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  min-height:44px; padding:0 16px; border-radius:99px; border:1.5px solid var(--line-strong);
  background:#fff; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s var(--ease);
}
.chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.chip:active{ transform:scale(.96); }
.custom-input{
  min-height:44px; border-radius:99px; border:1.5px dashed var(--line-strong); background:#fff;
  padding:0 16px; font-size:14px; width:120px; color:var(--ink); font-family:var(--font-num);
}
.custom-input:focus{ outline:2px solid var(--focus); border-style:solid; }

.child-list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
.child-row{
  display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:10px 12px;
}
.child-row .child-label{ font-size:13px; font-weight:700; color:var(--ink-soft); min-width:52px; }
.child-row input[type="range"]{ flex:1; }
.child-row .child-age{ font-family:var(--font-num); font-weight:700; min-width:40px; text-align:right; }
.stepper{ display:flex; align-items:center; gap:10px; }
.stepper button{
  width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line-strong); background:#fff;
  font-size:20px; font-weight:700; cursor:pointer; color:var(--ink);
}
.stepper button:active{ transform:scale(.9); }
.stepper .count{ font-family:var(--font-num); font-size:20px; font-weight:700; min-width:28px; text-align:center; }

.subfield{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none; }
.subfield.show{ display:block; }
.subfield label{ font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:6px; }

.sticky-cta{
  position:fixed; left:0; right:0; bottom:28px; z-index:30; padding:12px 16px calc(4px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--paper) 60%, transparent);
}
.btn-primary{
  width:100%; max-width:820px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px; border-radius:99px; border:none; background:var(--ink); color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; box-shadow:0 10px 24px rgba(19,26,44,.25);
}
.btn-primary:active{ transform:scale(.98); }
.btn-ghost{
  min-height:48px; padding:0 20px; border-radius:99px; border:1.5px solid var(--line-strong); background:transparent;
  color:var(--ink); font-weight:700; cursor:pointer;
}
.btn-ghost.on-dark{ border-color:var(--night-line); color:var(--night-ink); }

/* ==========================================================================
   3. 階段二：情境卡片
   ========================================================================== */
.scenario-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
.scenario-card{
  position:relative; text-align:left; background:var(--paper-raised); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:18px 16px 20px; cursor:pointer; box-shadow:var(--shadow-soft);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease); display:flex; flex-direction:column; gap:10px;
  min-height:168px;
}
.scenario-card:active{ transform:scale(.97); }
.scenario-card .icon{
  width:44px; height:44px; border-radius:12px; background:var(--accent-gold-soft); display:flex;
  align-items:center; justify-content:center; color:#7a5316;
}
.scenario-card .icon svg{ width:24px; height:24px; }
.scenario-card h3{ margin:0; font-size:16px; font-weight:800; }
.scenario-card p{ margin:0; font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
.badge-rec{
  position:absolute; top:14px; right:14px; font-size:11px; font-weight:800; color:#7a5316;
  background:var(--accent-gold-soft); padding:3px 9px; border-radius:99px;
}

/* ==========================================================================
   3.5 情境中繼選擇頁（癌別／治療方式／照顧方式）
   ========================================================================== */
.typeselect-head{ padding:110px 4px 8px; text-align:center; }
.typeselect-title{ font-size:clamp(24px,5.5vw,34px); font-weight:900; margin:0 0 10px; color:var(--night-ink); }
.typeselect-sub{ font-size:14.5px; color:var(--night-ink-soft); margin:0 0 30px; }
.typeselect-grid{ display:flex; flex-direction:column; gap:14px; max-width:560px; margin:0 auto 40px; }
.typeselect-btn{
  min-height:76px; border-radius:var(--radius-m); border:1.5px solid var(--night-line); background:rgba(255,255,255,0.04);
  color:var(--night-ink); text-align:left; padding:16px 20px; cursor:pointer; display:flex; flex-direction:column;
  justify-content:center; gap:5px; transition:all .2s var(--ease); width:100%;
}
.typeselect-btn:active{ transform:scale(.97); background:rgba(242,181,101,.14); border-color:var(--warm-candle); }
.typeselect-btn .tlabel{ font-size:17.5px; font-weight:800; }
.typeselect-btn .trange{ font-size:13.5px; color:var(--warm-candle); }

/* ==========================================================================
   4. 階段三：故事模式（深色沉浸式）
   ========================================================================== */
.story-topbar{
  position:fixed; top:0; left:0; right:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; pointer-events:none;
}
.story-topbar .iconbtn{ pointer-events:auto; background:rgba(18,29,66,0.7); border-color:var(--night-line); color:var(--night-ink); backdrop-filter:blur(6px); }
.story-progress{ position:fixed; top:0; left:0; height:3px; background:var(--warm-candle); z-index:41; transition:width .1s linear; }

.story-scroll{ position:relative; z-index:1; padding-bottom:40vh; }
.chapter{
  min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:100px 22px 60px; text-align:center; position:relative;
  opacity:0; transform:translateY(28px); transition:opacity .8s var(--ease), transform .8s var(--ease);
}
.chapter.in-view{ opacity:1; transform:translateY(0); }
.chapter .eyebrow{ font-size:13px; letter-spacing:.16em; color:var(--warm-candle); font-weight:700; margin-bottom:14px; text-transform:uppercase; }
.chapter h2{ font-size:clamp(26px,6vw,44px); line-height:1.3; margin:0 0 18px; font-weight:900; max-width:680px; }
.chapter .lede{ font-size:clamp(16px,3vw,19px); line-height:1.75; color:var(--night-ink-soft); max-width:560px; margin:0 auto; }
.chapter .accent{ color:var(--warm-candle); }
.chapter .ember{ color:var(--warm-ember); }

.chapter--opening{ background:radial-gradient(ellipse at 50% 20%, var(--night-2), var(--night-0) 70%); }

.cost-card{
  margin-top:22px; background:rgba(255,255,255,0.04); border:1px solid var(--night-line); border-radius:var(--radius-m);
  padding:18px 22px; min-width:240px; box-shadow:var(--shadow-night);
}
.cost-card .label{ font-size:12.5px; color:var(--night-ink-soft); margin-bottom:6px; }
.cost-card .amount{ font-size:clamp(28px,6vw,38px); font-family:var(--font-num); font-weight:700; color:var(--warm-candle); }

.timeline-track{ width:100%; max-width:640px; margin:36px auto 0; position:relative; }
.timeline-node{
  display:grid; grid-template-columns:88px 1fr; gap:16px; align-items:start; text-align:left;
  padding:16px 0; border-top:1px solid var(--night-line);
}
.timeline-node:first-child{ border-top:none; }
.timeline-node .tpoint{ font-size:13px; font-weight:800; color:var(--warm-candle); padding-top:2px; }
.timeline-node .tbody .tlabel{ font-size:15.5px; font-weight:700; margin-bottom:4px; }
.timeline-node .tbody .tnum{ font-size:22px; color:var(--night-ink); }
.timeline-node .tbody .tnote{ font-size:13px; color:var(--night-ink-soft); margin-top:4px; line-height:1.5; }
.timeline-node .tbody .tsavings{ font-size:13px; color:var(--night-ink-soft); margin-top:8px; padding-top:8px; border-top:1px dashed var(--night-line); }
.timeline-node .tbody .tsavings .savings-val{ color:var(--warm-candle); font-weight:700; }
.timeline-node .tbody .tsavings .savings-val.zero{ color:var(--warm-ember); }

.family-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; max-width:640px; margin:26px auto 0; }
.family-item{ background:rgba(255,255,255,0.04); border:1px solid var(--night-line); border-radius:var(--radius-s); padding:16px 14px; }
.family-item .ficon{ width:36px; height:36px; border-radius:10px; background:rgba(242,181,101,.15); display:flex; align-items:center; justify-content:center; margin:0 auto 10px; color:var(--warm-candle); }
.family-item .ficon svg{ width:20px; height:20px; }
.family-item .ftext{ font-size:13.5px; line-height:1.6; color:var(--night-ink-soft); }

.chapter--ending .final-line{ font-size:clamp(20px,4.4vw,28px); font-weight:800; line-height:1.6; max-width:560px; }
.ending-actions{ display:flex; gap:12px; margin-top:34px; flex-wrap:wrap; justify-content:center; }
.btn-solid{
  min-height:50px; padding:0 24px; border-radius:99px; background:var(--warm-candle); color:#241505; font-weight:800;
  border:none; cursor:pointer;
}
.btn-solid:active{ transform:scale(.97); }

/* 資產水位（家形容器） */
.tank-dock{
  position:fixed; right:14px; bottom:32px; z-index:35; width:118px; display:flex; flex-direction:column; align-items:center; gap:6px;
  pointer-events:none;
}
.tank-dock .tank-figure{ position:relative; width:100px; height:110px; }
.tank-dock svg{ width:100%; height:100%; overflow:visible; }
.tank-readout{ text-align:center; }
.tank-readout .tlab{ font-size:10px; color:var(--night-ink-soft); letter-spacing:.06em; }
.tank-readout .tval{ font-size:15px; font-family:var(--font-num); font-weight:700; color:var(--warm-candle); }
.tank-readout .tval.zero{ color:var(--warm-ember); }
.tank-second{ margin-top:8px; opacity:0; transform:translateY(6px); transition:all .5s var(--ease); }
.tank-second.show{ opacity:1; transform:translateY(0); }
.tank-wave{ animation:waveShift 4.2s linear infinite; }
@keyframes waveShift{ from{ transform:translateX(0); } to{ transform:translateX(-64px); } }
@media (prefers-reduced-motion: reduce){ .tank-wave{ animation:none; } }
@media (max-width:640px){
  .tank-dock{ right:8px; bottom:30px; width:88px; }
  .tank-dock .tank-figure{ width:78px; height:86px; }
}

/* 進階調整面板 */
.adjust-panel{
  position:fixed; top:0; right:0; height:100%; width:min(360px,88vw); z-index:50; background:var(--night-1);
  border-left:1px solid var(--night-line); transform:translateX(100%); transition:transform .35s var(--ease);
  padding:24px 20px; overflow-y:auto; box-shadow:var(--shadow-night);
}
.adjust-panel.open{ transform:translateX(0); }
.adjust-panel h3{ font-size:15px; margin:0 0 4px; font-weight:800; }
.adjust-panel .sub{ font-size:12.5px; color:var(--night-ink-soft); margin-bottom:20px; }
.adjust-field{ margin-bottom:22px; }
.adjust-field label{ font-size:13px; font-weight:700; display:flex; justify-content:space-between; margin-bottom:8px; }
.adjust-field label .av{ color:var(--warm-candle); font-family:var(--font-num); }
.scrim{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:45; opacity:0; pointer-events:none; transition:opacity .3s; }
.scrim.show{ opacity:1; pointer-events:auto; }

/* 深→暗轉場遮罩 */
.transition-veil{ position:fixed; inset:0; background:#000; z-index:100; opacity:0; pointer-events:none; }
.transition-veil.run{ animation:veilFlash 900ms ease forwards; }
@keyframes veilFlash{ 0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;} }
@media (prefers-reduced-motion: reduce){ .transition-veil.run{ animation:none; } }

.disclaimer{
  position:fixed; left:0; right:0; bottom:0; z-index:5; font-size:10.5px; text-align:center; color:var(--ink-soft);
  padding:6px 10px; background:rgba(243,245,248,.92); border-top:1px solid var(--line);
}
.dark .disclaimer{ background:rgba(6,10,22,.85); color:var(--night-ink-soft); border-top:1px solid var(--night-line); }

.count-formula{ margin-top:14px; font-size:13.5px; color:var(--night-ink-soft); }
.count-formula b{ color:var(--warm-candle); font-family:var(--font-num); }

@media (max-width:400px){
  .wrap{ padding:14px 12px 150px; }
  .chip{ padding:0 12px; font-size:13px; }
}
</style>
</head>
<body>

<div id="app">

  <!-- ============================ STAGE 1 ============================ -->
  <section id="stage-setup" class="stage stage--light active">
    <div class="topbar">
      <h1>家庭保障故事工具・客戶背景設定</h1>
      <button class="iconbtn" id="btnReset" title="重設" aria-label="重設">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>

    <div class="wrap" id="setupForm">

      <div class="field">
        <h2>主要收入者年齡</h2>
        <div class="value-row"><span class="big num" id="ageVal">35</span><span class="unit">歲</span></div>
        <input type="range" id="ageSlider" min="25" max="60" value="35" step="1">
      </div>

      <div class="field">
        <h2>家庭月收入</h2>
        <div class="chip-row" id="incomeChips"></div>
      </div>

      <div class="field">
        <h2>配偶</h2>
        <div class="chip-row" id="spouseChips"></div>
      </div>

      <div class="field">
        <h2>子女</h2>
        <div class="stepper">
          <button type="button" id="childMinus" aria-label="減少子女">－</button>
          <span class="count num" id="childCount">2</span>
          <button type="button" id="childPlus" aria-label="增加子女">＋</button>
        </div>
        <div class="child-list" id="childList"></div>
      </div>

      <div class="field">
        <h2>存款</h2>
        <div class="chip-row" id="savingsChips"></div>
      </div>

      <div class="field">
        <h2>股票／基金</h2>
        <div class="chip-row" id="stockToggle"></div>
        <div class="subfield" id="stockAmountWrap">
          <label>持有金額</label>
          <div class="chip-row" id="stockChips"></div>
        </div>
      </div>

      <div class="field">
        <h2>房子</h2>
        <div class="chip-row" id="houseChips"></div>
        <div class="subfield" id="mortgageWrap">
          <label>房貸剩餘金額（萬）</label>
          <input type="range" id="mortgageRemainSlider" min="50" max="2000" step="10" value="800">
          <div class="value-row"><span class="big num" id="mortgageRemainVal">800</span><span class="unit">萬</span></div>
          <label style="margin-top:12px">每月房貸月付金（萬）</label>
          <input type="range" id="mortgageMonthlySlider" min="0.5" max="15" step="0.1" value="3.5">
          <div class="value-row"><span class="big num" id="mortgageMonthlyVal">3.5</span><span class="unit">萬 / 月</span></div>
        </div>
      </div>

    </div>

    <div class="sticky-cta">
      <button class="btn-primary" id="btnToScenarios">下一步：選擇情境
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- ============================ STAGE 2 ============================ -->
  <section id="stage-scenarios" class="stage stage--light">
    <div class="topbar">
      <button class="iconbtn" id="btnBackToSetup" aria-label="返回設定">

function fmtMoney(v){
  // 統一金額顯示規則：
  // < 1萬：千分位 + 元（例如 15,000 元）
  // 1萬 ≤ 金額 < 100萬：保留一位小數的萬，小數為 0 時省略（例如 1.5 萬 / 16 萬）
  // ≥ 100萬：四捨五入到整數萬，千分位（例如 255 萬 / 1,280 萬）
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  if(abs < 10000){
    return sign + Math.round(abs).toLocaleString('zh-TW') + ' 元';
  }
  if(abs < 1000000){
    const tenths = Math.round(abs/1000); // 萬位的十分位整數，例如 15000 → 15（代表 1.5 萬）
    const wanInt = Math.floor(tenths/10);
    const decimal = tenths % 10;
    const wanStr = decimal === 0 ? String(wanInt) : (wanInt + '.' + decimal);
    return sign + wanStr + ' 萬';
  }
  const wanInt = Math.round(abs/10000);
  return sign + wanInt.toLocaleString('zh-TW') + ' 萬';
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function monthLabel(m){
  if(m % 12 === 0) return (m/12) + '年後';
  return m + '個月後';
}

/* ==========================================================================

function renderChips(container, presets, currentVal, onPick, opts){
  opts = opts || {};
  container.innerHTML = '';
  presets.forEach(p=>{
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className='chip'; btn.textContent = p.label;
    if(p.v === currentVal) btn.classList.add('active');
    btn.addEventListener('click', ()=>{ onPick(p.v); refreshSetupUI(); });
    container.appendChild(btn);
  });
  if(opts.allowCustom){
    const wrap = document.createElement('input');
    wrap.type='number'; wrap.className='custom-input'; wrap.placeholder='自訂(元)';
    wrap.value = presets.some(p=>p.v===currentVal) ? '' : currentVal;
    wrap.addEventListener('change', ()=>{ const v = Number(wrap.value)||0; onPick(v); refreshSetupUI(); });
    container.appendChild(wrap);
  }
}

function renderChildList(){
  const list = document.getElementById('childList');
  list.innerHTML = '';
  household.children.forEach((age, idx)=>{
    const row = document.createElement('div'); row.className='child-row';
    row.innerHTML = `
      <span class="child-label">第 ${idx+1} 名</span>
      <input type="range" min="0" max="18" step="1" value="${age}" data-idx="${idx}">
      <span class="child-age num">${age} 歲</span>`;
    const slider = row.querySelector('input');
    slider.addEventListener('input', (e)=>{
      household.children[idx] = Number(e.target.value);
      row.querySelector('.child-age').textContent = household.children[idx] + ' 歲';
      saveHousehold();
    });
    list.appendChild(row);
  });
  document.getElementById('childCount').textContent = household.children.length;
}

function refreshSetupUI(){
  saveHousehold();
  document.getElementById('ageVal').textContent = household.mainAge;
  document.getElementById('ageSlider').value = household.mainAge;

  renderChips(document.getElementById('incomeChips'), CONFIG.incomePresets, household.monthlyIncome,
    v=>household.monthlyIncome=v, {allowCustom:true});

  renderChips(document.getElementById('spouseChips'),
    [{v:'none',label:'無'},{v:'dual',label:'有・雙薪'},{v:'single',label:'有・單薪'}],
    household.spouseType, v=>household.spouseType=v);

  renderChildList();

  renderChips(document.getElementById('savingsChips'), CONFIG.savingsPresets, household.savings,
    v=>household.savings=v, {allowCustom:true});

  renderChips(document.getElementById('stockToggle'), [{v:false,label:'無'},{v:true,label:'有'}], household.hasStock,
    v=>household.hasStock=v);
  document.getElementById('stockAmountWrap').classList.toggle('show', household.hasStock);
  renderChips(document.getElementById('stockChips'), CONFIG.stockPresets, household.stockAmount,
    v=>household.stockAmount=v, {allowCustom:true});

  renderChips(document.getElementById('houseChips'),
    [{v:'none',label:'無'},{v:'paid',label:'有・已繳清'},{v:'mortgage',label:'有・房貸中'}],
    household.houseStatus, v=>household.houseStatus=v);
  document.getElementById('mortgageWrap').classList.toggle('show', household.houseStatus==='mortgage');
  document.getElementById('mortgageRemainSlider').value = household.mortgageRemaining/10000;
  document.getElementById('mortgageRemainVal').textContent = household.mortgageRemaining/10000;
  document.getElementById('mortgageMonthlySlider').value = household.mortgageMonthly/10000;
  document.getElementById('mortgageMonthlyVal').textContent = (household.mortgageMonthly/10000).toFixed(1);
}

/* ==========================================================================
   STAGE 2：情境選擇
   ========================================================================== */
function renderScenarioGrid(){
  const grid = document.getElementById('scenarioGrid');
  grid.innerHTML = '';
  SCENARIO_LIST.forEach(sc=>{
    if(!sc.visible(household)) return;
    const card = document.createElement('button');
    card.type='button'; card.className='scenario-card';
    const isRec = sc.recommended && sc.recommended(household);
    card.innerHTML = `
      ${isRec ? '<span class="badge-rec">推薦</span>' : ''}
      <span class="icon">${iconSvg(sc.icon)}</span>
      <h3>${sc.title}</h3>
      <p>${sc.guideLine}</p>`;
    card.addEventListener('click', ()=>{
      if(sc.types || sc.careModes){ enterTypeSelect(sc.id); } else { enterStory(sc.id); }
    });
    grid.appendChild(card);
  });
}
document.getElementById('btnBackToSetup').addEventListener('click', ()=>{
  goToStage('stage-setup'); refreshSetupUI();
});

/* ==========================================================================
   STAGE 2.5：情境中繼選擇頁 — 業務員在客戶面前直接選癌別／治療方式／照顧方式
   ========================================================================== */
let pendingScenarioId = null;

function enterTypeSelect(scenarioId){
  pendingScenarioId = scenarioId;
  runTransitionVeil(()=>{
    goToStage('stage-typeselect');
    renderTypeSelect(scenarioId);
  });
}

function renderTypeSelect(scenarioId){
  const sc = CONFIG.scenarios[scenarioId];
  const wrap = document.getElementById('typeSelectWrap');
  const isCareMode = !!sc.careModes;
  const options = isCareMode ? sc.careModes : sc.types;
  const titleText = scenarioId === 'cancer_targeted' ? '他確診的是——'
    : scenarioId === 'cancer_immuno' ? '這次要選擇的治療方式是——'
    : '需要的照顧方式是——';
  const subText = scenarioId === 'cancer_targeted' ? '點選癌別，故事會依這個類型的常見自費級距展開。'
    : scenarioId === 'cancer_immuno' ? '三種治療方式，健保都不給付，費用級距差異很大。'
    : '兩種常見的照顧安排，費用結構不同。';

  wrap.innerHTML = `
    <div class="typeselect-head">
      <h2 class="typeselect-title">${titleText}</h2>
      <p class="typeselect-sub">${subText}</p>
    </div>
    <div class="typeselect-grid" id="typeSelectGrid"></div>
  `;
  const grid = document.getElementById('typeSelectGrid');
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'typeselect-btn';
    const rangeText = opt.range || opt.note || '';
    btn.innerHTML = `<span class="tlabel">${opt.label}</span><span class="trange">${rangeText}</span>`;
    btn.addEventListener('click', ()=>{
      overrides[scenarioId] = overrides[scenarioId] || {};
      const ov = overrides[scenarioId];
      if(isCareMode){
        ov.careModeId = opt.id; delete ov.careMonthly;
      } else {
        ov.typeId = opt.id; delete ov.monthlyDrug; delete ov.lumpSum;
      }
      enterStory(scenarioId);
    });
    grid.appendChild(btn);
  });
}
document.getElementById('btnBackFromTypeSelect').addEventListener('click', ()=>{
  goToStage('stage-scenarios'); renderScenarioGrid();
});

/* ==========================================================================
   計算引擎：依情境 + 客戶背景 + 進階覆蓋值，算出敘事所需的所有數字
   ========================================================================== */
function getIncomeImpactFactor(){
  return CONFIG.general.incomeImpact[household.spouseType] ?? 1.0;
}

function buildModel(scenarioId, ov){
  const sc = CONFIG.scenarios[scenarioId];
  ov = ov || {};
  const h = household;
  const impact = getIncomeImpactFactor();

  if(scenarioId === 'cancer_targeted'){
    const typeId = ov.typeId || sc.defaults.typeId;
    const type = sc.types.find(t=>t.id===typeId) || sc.types[0];
    const monthlyDrug = ov.monthlyDrug ?? type.monthly;
    const duration = ov.durationMonths ?? sc.defaults.durationMonths;
    const dropRatio = ov.incomeDropRatio ?? sc.defaults.incomeDropRatio;
    const incomeLoss = h.monthlyIncome * dropRatio * impact;
    const mortgageBurden = h.houseStatus==='mortgage' ? h.mortgageMonthly : 0;
    const monthlyDrain = monthlyDrug + incomeLoss + mortgageBurden;
    const totalMonths = duration;
    const series = simulateSeries(h.savings, [{from:0,to:duration,monthly:monthlyDrain}], [], totalMonths);
    const marks = [1,6,12,duration].filter((v,i,arr)=>arr.indexOf(v)===i && v<=duration);
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・'+type.label, title:'健檢報告上，多了三個字。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'那一天之後', text:`健保給付有條件限制，超出適應症的標靶藥物，第一筆自費帳單就是每月 ${fmtMoney(monthlyDrug)}。`, firstCost: monthlyDrug },
      timelineNodes: marks.map(m=>({
        month:m, label: monthLabel(m),
        tnum: fmtMoney(monthlyDrain*m) + '（累計自費＋收入缺口）',
        note: `每月藥費 ${fmtMoney(monthlyDrug)}，加上收入減少約 ${Math.round(dropRatio*100)}%，家庭實際少掉 ${fmtMoney(incomeLoss)}／月${mortgageBurden>0?`，房貸 ${(h.mortgageMonthly/10000).toFixed(1)} 萬／月照樣要繳`:''}`,
      })),
      family:[
        {icon:'hands', text: h.spouseType==='dual' ? '配偶考慮請假照顧，雙薪變單薪的時間越拉越長。' : '沒有第二份收入支撐，存款下降的速度更快。'},
        {icon:'home-heart', text: h.children.length>0 ? `孩子的才藝課、安親班，第一個被喊停。` : '生活開銷全面緊縮，能省則省。'},
      ],
      ending:`這一切，發生在確診後的第 ${duration} 個月，療程仍未結束。`,
    };
  }

  if(scenarioId === 'cancer_immuno'){
    const typeId = ov.typeId || sc.defaults.typeId;
    const type = sc.types.find(t=>t.id===typeId) || sc.types[0];
    const lumpSum = ov.lumpSum ?? type.amount;
    const aftercareMonthly = ov.aftercareMonthly ?? sc.defaults.aftercareMonthly;
    const aftercareMonths = sc.defaults.aftercareMonths;
    const totalMonths = Math.max(aftercareMonths, 12);
    const events = [{month:0, amount:lumpSum, label:type.label}];
    const series = simulateSeries(h.savings, [{from:0,to:aftercareMonths,monthly:aftercareMonthly}], events, totalMonths);
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・'+type.label, title:'健保不給付的那個選擇。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'決定的那一刻', text:`${type.label}（${type.note}），這次選定的費用是 ${fmtMoney(lumpSum)}，必須一次到位。`, firstCost:lumpSum },
      timelineNodes:[
        {month:0, label:'決定當下', tnum: fmtMoney(lumpSum), note:'一次性治療費用，存款瞬間蒸發一大塊。'},
        {month:3, label:'3個月後', tnum: fmtMoney(lumpSum+aftercareMonthly*3), note:`加上後續追蹤照護，每月再增加 ${fmtMoney(aftercareMonthly)}`},
        {month:aftercareMonths, label:monthLabel(aftercareMonths), tnum: fmtMoney(lumpSum+aftercareMonthly*aftercareMonths), note:'追蹤照護期結束的累計花費。'},
      ],
      family:[
        {icon:'flask', text:'要不要動用股票／基金？現在市場正好還是低點。'},
        {icon:'home-heart', text: h.houseStatus!=='none' ? '房子能不能拿去增貸？這個念頭第一次認真浮現。' : '存款以外，幾乎沒有其他退路。'},
      ],
      ending:'這一切，發生在做出治療決定的那一天。',
    };
  }

  if(scenarioId === 'death'){
    const eduPerYear = ov.educationPerChildPerYear ?? CONFIG.general.educationPerChildPerYear;
    const livingRatio = ov.livingCostRatio ?? CONFIG.general.livingCostRatio;
    const mortgageLump = h.houseStatus==='mortgage' ? h.mortgageRemaining : 0;
    const livingMonthly = h.monthlyIncome * livingRatio;
    const totalMonths = 120;
    function eduMonthlyAt(m){
      let sum=0;
      h.children.forEach(age=>{
        const ageAtM = age + m/12;
        if(ageAtM < CONFIG.general.childAdultAge) sum += eduPerYear/12;
      });
      return sum;
    }
    // 用平均教育月費估算（簡化：以目前狀態下的教育月費做為主要展示值，供水位模擬使用平滑估計）
    const avgEduMonthly = eduMonthlyAt(0);
    const grossMonthlyNeed = livingMonthly + avgEduMonthly;

    // 雙薪家庭：存活配偶仍有收入，估算其月收入 ≈ 家庭月收入 ×（1 − incomeImpact.dual），用來扣抵每月淨缺口
    const survivingSpouseIncome = h.spouseType === 'dual' ? h.monthlyIncome * (1 - CONFIG.general.incomeImpact.dual) : 0;
    const rawGap = grossMonthlyNeed - survivingSpouseIncome;
    const dailyLifeCovered = h.spouseType === 'dual' && rawGap <= 0;
    const monthlyDrain = Math.max(0, rawGap);

    const spouseNote = h.spouseType==='dual'
      ? `已計入配偶收入約 ${fmtMoney(survivingSpouseIncome)}／月`
      : (h.spouseType==='single' ? '配偶沒有其他收入來源' : '沒有配偶可分擔');

    const events = mortgageLump>0 ? [{month:0, amount:mortgageLump, label:'剩餘房貸'}] : [];
    const series = simulateSeries(h.savings, [{from:0,to:totalMonths,monthly:monthlyDrain}], events, totalMonths);
    const marks = [1,12,36,120];
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・身故', title:'如果明天，沒有回家的人是他。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'留下來的人，要面對三張帳單', text: `${mortgageLump>0?`第一張：剩餘房貸 ${fmtMoney(mortgageLump)}，銀行不會因為誰不在了就不用還。`:'沒有房貸壓力，但生活費與教育金仍要繼續。'}`, firstCost: mortgageLump },
      timelineNodes: marks.map(m=>({
        month:m, label: monthLabel(m),
        tnum: fmtMoney(monthlyDrain*m + mortgageLump),
        note: dailyLifeCovered
          ? `${spouseNote}，日常生活撐得住，水位主要反映剩餘房貸的一次性衝擊；房貸與子女教育金仍是家庭要單獨扛起的大額支出。`
          : `生活費（月收入 ${Math.round(livingRatio*100)}%）＋子女教育金，${spouseNote}，累計淨缺口。`,
      })),
      family:[
        {icon:'hands', text: h.spouseType==='dual'
          ? (dailyLifeCovered ? '配偶的收入撐得住日常開銷，但房貸與教育金這兩筆大額支出，仍要獨自面對。' : '配偶原本的收入，不足以完全撐起整個家，缺口還是要靠存款補。')
          : '配偶原本沒有工作，現在必須重新找工作。'},
        {icon:'home-heart', text: h.children.length>0 ? `${h.children.length} 個孩子的教育金，時間軸拉到他們 22 歲為止。` : '沒有子女，但生活重心仍需要十年時間重新站穩。'},
      ],
      ending:'這一切，會持續整整十年，而決定發生在同一天。',
    };
  }

  if(scenarioId === 'disability_care'){
    const modeId = ov.careModeId || sc.defaults.careModeId;
    const mode = sc.careModes.find(m=>m.id===modeId) || sc.careModes[0];
    const careMonthly = ov.careMonthly ?? mode.monthly;
    const careYears = ov.careYears ?? sc.defaults.careYears;
    const incomeLoss = h.monthlyIncome * impact;
    const mortgageBurden = h.houseStatus==='mortgage' ? h.mortgageMonthly : 0;
    const monthlyDrain = careMonthly + incomeLoss + mortgageBurden;
    const totalMonths = careYears*12;
    const series = simulateSeries(h.savings, [{from:0,to:totalMonths,monthly:monthlyDrain}], [], totalMonths);
    const marks = [1,12,60,totalMonths].filter((v,i,arr)=>v<=totalMonths && arr.indexOf(v)===i);
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・失能長照', title:'留下來，但需要被照顧。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'持續失血的開始', text:`${mode.label}，每月 ${fmtMoney(careMonthly)}，加上本人收入完全中斷，這筆支出沒有停下來的一天。`, firstCost: careMonthly },
      timelineNodes: marks.map(m=>({
        month:m, label: monthLabel(m),
        tnum: fmtMoney(monthlyDrain*m),
        note:`累計照顧費用＋收入缺口，第 ${m} 個月的水位。${mortgageBurden>0?`房貸 ${(h.mortgageMonthly/10000).toFixed(1)} 萬／月照樣要繳。`:''}`,
      })),
      family:[
        {icon:'hands', text:'家人需要輪流請假照顧，工作與收入也跟著受影響。'},
        {icon:'home-heart', text:'家裡的生活重心，全部圍著照顧這件事打轉。'},
      ],
      countFormula: `每月 ${fmtMoney(careMonthly)} × 12 × ${careYears} 年 = <b>${fmtMoney(careMonthly*12*careYears)}</b>`,
      ending: `這一切，將持續 ${careYears} 年，是最貴的一種風險。`,
    };
  }

  if(scenarioId === 'stroke_mi'){
    const acuteCost = ov.acuteCost ?? sc.defaults.acuteCost;
    const rehabMonths = ov.rehabMonths ?? sc.defaults.rehabMonths;
    const rehabMonthly = ov.rehabMonthly ?? sc.defaults.rehabMonthly;
    const incomeLossFull = h.monthlyIncome * impact;
    const mortgageBurden = h.houseStatus==='mortgage' ? h.mortgageMonthly : 0;
    const phaseAMonthly = rehabMonthly + incomeLossFull + mortgageBurden;
    const phaseBMonthly = (rehabMonthly*0.3) + incomeLossFull*0.3 + mortgageBurden;
    const totalMonths = rehabMonths + 12;
    const events = [{month:0, amount:acuteCost, label:'急性期醫療自費'}];
    const series = simulateSeries(h.savings,
      [{from:0,to:rehabMonths,monthly:phaseAMonthly},{from:rehabMonths,to:totalMonths,monthly:phaseBMonthly}],
      events, totalMonths);
    const isHighRisk = h.mainAge>=sc.highRiskAgeMin && h.mainAge<=sc.highRiskAgeMax;
    const mortgageNote = mortgageBurden>0 ? `，房貸 ${(h.mortgageMonthly/10000).toFixed(1)} 萬／月照樣要繳` : '';
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・腦中風／心肌梗塞', title:'「我還年輕」——加護病房裡最常聽到的一句話。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'活下來了，然後呢', text:`急性期醫療自費先付出 ${fmtMoney(acuteCost)}，${isHighRisk?'而現在的年齡，正落在腦中風／心肌梗塞的好發年齡帶。':'這個風險不分年齡，越早準備越安心。'}`, firstCost:acuteCost },
      timelineNodes:[
        {month:0, label:'發病當下', tnum: fmtMoney(acuteCost), note:'急性期醫療自費，一次到位。'},
        {month:rehabMonths, label:`復健期滿 ${rehabMonths} 個月`, tnum: fmtMoney(acuteCost+phaseAMonthly*rehabMonths), note:`活下來了，但完全無法工作，收入是零${mortgageNote}。`},
        {month:totalMonths, label:'滿 1 年後', tnum: fmtMoney(acuteCost+phaseAMonthly*rehabMonths+phaseBMonthly*12), note:`部分復原，但收入與體力都回不到從前${mortgageNote}。`},
      ],
      family:[
        {icon:'heartbeat', text:'復健是長期抗戰，不是住院幾天就結束。'},
        {icon:'hands', text: h.spouseType==='dual' ? '配偶的收入，成為這段期間唯一的浮木。' : '家裡沒有第二份收入可以撐住這段空窗期。'},
      ],
      ending:'這一切，從「還活著」的那一刻才真正開始。',
    };
  }

  if(scenarioId === 'caregiver_down'){
    const childcarePerChild = ov.childcarePerChild ?? sc.defaults.childcarePerChild;
    const houseworkOutsource = ov.houseworkOutsource ?? sc.defaults.houseworkOutsource;
    const adhoc = ov.adhoc ?? sc.defaults.adhoc;
    const youngChildren = h.children.filter(a=>a<12).length;
    const mortgageBurden = h.houseStatus==='mortgage' ? h.mortgageMonthly : 0;
    const monthlyDrain = (childcarePerChild * Math.max(youngChildren,0)) + houseworkOutsource + adhoc + mortgageBurden;
    const years = sc.defaults.years;
    const totalMonths = years*12;
    const series = simulateSeries(h.savings, [{from:0,to:totalMonths,monthly:monthlyDrain}], [], totalMonths);
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・家庭照顧者倒下', title:'沒有薪水單的人，其實最貴。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'一夜之間，多出一張新帳單', text: youngChildren>0 ? `保母／安親班每名子女約 ${fmtMoney(childcarePerChild)}／月，再加上家務外包與接送，新增支出每月 ${fmtMoney(monthlyDrain)}。` : `家務外包與臨時照顧安排，新增支出每月 ${fmtMoney(monthlyDrain)}。`, firstCost: monthlyDrain },
      timelineNodes:[1,6,12,36].map(m=>({
        month:m, label: monthLabel(m),
        tnum: fmtMoney(monthlyDrain*m),
        note:`原本「不用花錢」的照顧工作，現在全部要外包計價。${mortgageBurden>0?`房貸 ${(h.mortgageMonthly/10000).toFixed(1)} 萬／月照樣要繳。`:''}`,
      })),
      family:[
        {icon:'hands', text:'原本每天接送、張羅三餐的人不在，全部要花錢請人做。'},
        {icon:'home-heart', text: youngChildren>0 ? `${youngChildren} 個年幼子女的日常照顧，一夕之間變成現金支出。` : '家務與生活調度，需要重新安排與外包。'},
      ],
      ending:'這一切，是多數人從沒認真算過的一筆帳。',
    };
  }

  if(scenarioId === 'liquidity_crisis'){
    const houseAssumed = ov.assumedHouseValue ?? (h.houseStatus!=='none' ? Math.round(h.mortgageRemaining*1.6/500000)*500000 || 6000000 : 0);
    const totalEstate = h.savings + (h.hasStock?h.stockAmount:0) + (h.houseStatus!=='none'?houseAssumed:0);
    const netTaxable = Math.max(0, totalEstate - CONFIG.inheritanceTax.exemption);
    const tax = calcInheritanceTax(netTaxable);
    const cashGap = Math.max(0, tax - h.savings);
    const totalMonths = CONFIG.inheritanceTax.paymentMonths;
    const events = [{month: totalMonths, amount: tax, label:'遺產稅款'}];
    const series = simulateSeries(h.savings, [], events, totalMonths);
    return {
      sc, totalMonths, series,
      opening:{ eyebrow:'情境・資產流動性危機', title:'資產很多，但現金不夠。', lede: sc.guideLine.replace(/「|」/g,'') },
      thatDay:{ title:'資產總值 vs. 手上的現金', text: `資產總值約 ${fmtMoney(totalEstate)}（存款＋股票＋房屋現值估算），但依簡化級距試算，遺產稅款約 ${fmtMoney(tax)}，須在 ${totalMonths} 個月內以現金繳清。`, firstCost: tax },
      timelineNodes:[
        {month:0, label:'資產盤點', tnum: fmtMoney(totalEstate), note:'存款＋股票／基金＋房屋現值（估），帳面上看起來很安心。'},
        {month:totalMonths, label:`${totalMonths} 個月申報期限`, tnum: fmtMoney(tax), note: cashGap>0 ? `手上現金不足以支付稅款，現金缺口約 ${fmtMoney(cashGap)}。` : '現金尚可支應稅款，但流動性仍會大幅下降。'},
      ],
      family:[
        {icon:'lock', text:'房子賣不掉、股票可能正好在低點，資產與現金是兩件事。'},
        {icon:'home-heart', text: cashGap>0 ? '要嘛急售資產，要嘛先借錢繳稅，兩個選項都不輕鬆。' : '就算繳得出來，家裡的現金水位也會瞬間見底。'},
      ],
      ending:'這一切，在申報期限倒數的那六個月內全部發生。',
      isLumpDeadline:true,
    };
  }
}

function calcInheritanceTax(netTaxable){
  const b = CONFIG.inheritanceTax.brackets;
  let remaining = netTaxable, tax=0, prevCap=0;
  for(const seg of b){
    const capSize = seg.upTo===Infinity ? Infinity : seg.upTo - prevCap;
    const amt = Math.min(remaining, capSize);
    if(amt>0) tax += amt*seg.rate;
    remaining -= amt;
    prevCap = seg.upTo;
    if(remaining<=0) break;
  }
  return tax;
}

/* 模擬存款水位隨月份變化：phases為持續性月支出區間，events為一次性支出 */
function simulateSeries(initialSavings, phases, events, totalMonths){
  const series = [];
  let cash = initialSavings;
  for(let m=0; m<=totalMonths; m++){
    events.filter(e=>e.month===m).forEach(e=>{ cash -= e.amount; });
    if(m>0){
      phases.forEach(p=>{ if(m>p.from && m<=p.to) cash -= p.monthly; });
    }
    series.push(Math.round(cash));
  }
  let zeroMonth = null;
  for(let m=0;m<series.length;m++){ if(series[m]<=0){ zeroMonth=m; break; } }
  return { values: series, zeroMonth };
}

/* ==========================================================================
   STAGE 3：故事模式渲染
   ========================================================================== */
let ioObserver = null;

function enterStory(scenarioId){
  currentScenarioId = scenarioId;
  overrides[scenarioId] = overrides[scenarioId] || {};
  runTransitionVeil(()=>{
    goToStage('stage-story');
    renderStory();
  });
}

function runTransitionVeil(cb){
  const veil = document.getElementById('transitionVeil');
  veil.classList.remove('run'); void veil.offsetWidth; veil.classList.add('run');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(cb, reduced?0:420);
}

function renderStory(){
  const sc = CONFIG.scenarios[currentScenarioId];
  storyModel = buildModel(currentScenarioId, overrides[currentScenarioId]);
  const scroll = document.getElementById('storyScroll');
  scroll.innerHTML = '';
  scroll.scrollTop = 0;
  window.scrollTo(0,0);

  // 章節 1：開場
  scroll.appendChild(chapterEl('opening', `
    <div class="eyebrow">${storyModel.opening.eyebrow}</div>
    <h2>${storyModel.opening.title}</h2>
    <p class="lede">${storyModel.opening.lede}</p>
  `));

  // 章節 2：那一天
  scroll.appendChild(chapterEl('thatday', `
    <div class="eyebrow">那一天</div>
    <h2>${storyModel.thatDay.title}</h2>
    <p class="lede">${storyModel.thatDay.text}</p>
    <div class="cost-card"><div class="label">第一筆費用</div><div class="amount num" data-count="${storyModel.thatDay.firstCost}">0</div></div>
  `));

  // 章節 3：時間軸推進（每個節點同時對照「累計支出」與「存款水位」）
  const nodesHtml = storyModel.timelineNodes.map(n=>{
    const monthIdx = clamp(n.month, 0, storyModel.series.values.length-1);
    const savingsAtMonth = storyModel.series.values[monthIdx];
    const savingsText = savingsAtMonth<=0 ? '已歸零' : fmtMoney(savingsAtMonth);
    return `
    <div class="timeline-node" data-month="${n.month}">
      <div class="tpoint">${n.label}</div>
      <div class="tbody">
        <div class="tlabel">累計支出</div>
        <div class="tnum num" data-target="${n.tnum}">計算中…</div>
        <div class="tnote">${n.note}</div>
        <div class="tsavings">存款水位：<span class="num savings-val${savingsAtMonth<=0?' zero':''}" data-target="${savingsText}">計算中…</span></div>
      </div>
    </div>`;
  }).join('');
  scroll.appendChild(chapterEl('timeline', `
    <div class="eyebrow">時間軸推進</div>
    <h2>時間，才是這個風險真正的放大器</h2>
    <div class="timeline-track">${nodesHtml}</div>
    ${storyModel.countFormula ? `<div class="count-formula">${storyModel.countFormula}</div>` : ''}
  `));

  // 章節 4：家庭連鎖
  const famHtml = storyModel.family.map(f=>`
    <div class="family-item">
      <div class="ficon">${iconSvg(f.icon)}</div>
      <div class="ftext">${f.text}</div>
    </div>`).join('');
  scroll.appendChild(chapterEl('family', `
    <div class="eyebrow">家庭連鎖反應</div>
    <h2>不只是他，是全家人的日子都變了</h2>
    <div class="family-grid">${famHtml}</div>
  `));

  // 章節 5：結尾定格
  scroll.appendChild(chapterEl('ending', `
    <div class="eyebrow">停在這裡</div>
    <div class="final-line">${storyModel.ending}</div>
    <div class="ending-actions">
      <button class="btn-solid" id="btnAnotherScenario">換一個情境</button>
      <button class="btn-ghost on-dark" id="btnAdjustSetup">調整設定</button>
    </div>
  `, 'chapter--ending'));

  document.getElementById('btnAnotherScenario').addEventListener('click', ()=>{
    goToStage('stage-scenarios'); renderScenarioGrid();
  });
  document.getElementById('btnAdjustSetup').addEventListener('click', ()=>{
    goToStage('stage-setup'); refreshSetupUI();
  });

  setupIntersectionObserver();
  buildAdjustPanel();
  lastViewedMonth = 0;
  updateTank(0);
  bindScrollTankSync();
}

function chapterEl(kind, html, extraClass){
  const div = document.createElement('div');
  div.className = 'chapter chapter--'+kind + (extraClass?(' '+extraClass):'');
  div.innerHTML = html;
  return div;
}

function setupIntersectionObserver(){
  if(ioObserver) ioObserver.disconnect();
  const chapters = document.querySelectorAll('.chapter');
  ioObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        entry.target.querySelectorAll('[data-count]').forEach(el=>{
          if(!el.dataset.done){ el.dataset.done='1'; animateCount(el, Number(el.dataset.count)); }
        });
        entry.target.querySelectorAll('[data-target]').forEach(el=>{
          if(!el.dataset.done){ el.dataset.done='1'; el.textContent = el.dataset.target; }
        });
        const month = entry.target.dataset.month;
        if(month !== undefined){ lastViewedMonth = Number(month); updateTank(lastViewedMonth); }
      }
    });
  }, { threshold:0.4 });
  chapters.forEach(c=>ioObserver.observe(c));
  document.querySelectorAll('.timeline-node').forEach(n=>ioObserver.observe(n));
}

function animateCount(el, target){
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ el.textContent = fmtMoney(target); return; }
  const dur = 1100; const start = performance.now();
  function step(now){
    const p = clamp((now-start)/dur,0,1);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = fmtMoney(target*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---- 資產水位（家形容器） ---- */
let tankAnimFrame = null;
let lastViewedMonth = 0; // C4：記錄業務員目前滾動到的時間節點，供進階調整後維持水位位置
function updateTank(month){
  if(!storyModel) return;
  const series = storyModel.series;
  const idx = clamp(month, 0, series.values.length-1);
  const value = series.values[idx];
  const initial = household.savings;
  const pct = clamp(value/Math.max(initial,1), 0, 1);

  // house shape 內部 y 範圍約 40(頂)~92(底)，液面高度依 pct 內插
  const topY = 40, botY = 92;
  const targetY = botY - pct*(botY-topY);
  const rect = document.getElementById('waterRect');
  const wave = document.getElementById('waveA');
  const crack = document.getElementById('crackGroup');
  rect.setAttribute('y', targetY.toFixed(1));
  rect.setAttribute('height', (100-targetY).toFixed(1));
  wave.setAttribute('transform', `translate(0, ${targetY-3})`);

  const valEl = document.getElementById('tankValue');
  const isZero = value<=0;
  valEl.classList.toggle('zero', isZero);
  valEl.textContent = isZero ? `第 ${series.zeroMonth ?? idx} 個月・存款歸零` : fmtMoney(value);
  crack.setAttribute('opacity', isZero ? '1' : '0');

  const secondWrap = document.getElementById('tankSecondWrap');
  const secondVal = document.getElementById('tankSecondValue');
  const secondLabel = document.getElementById('tankSecondLabel');
  const overshoot = Math.max(0, -value);
  const hasStock = household.hasStock;
  const hasHouse = household.houseStatus !== 'none';

  if(!isZero){
    secondWrap.classList.remove('show');
  } else if(!hasStock && !hasHouse){
    secondLabel.textContent = '其他可動用資產';
    secondVal.textContent = '沒有其他可動用資產';
    secondWrap.classList.add('show');
  } else if(hasStock && (household.stockAmount - overshoot) > 0){
    // 股票／基金尚未扣完，先反映股票變現中的餘額
    secondLabel.textContent = '股票／基金（變現中）';
    secondVal.textContent = fmtMoney(household.stockAmount - overshoot);
    secondWrap.classList.add('show');
  } else if(hasHouse){
    // 股票已扣完（或本來就沒有股票），才輪到房產：現值採用與情境7一致的估算邏輯
    const houseValue = getAssumedHouseValue();
    const houseOvershoot = hasStock ? Math.max(0, overshoot - household.stockAmount) : overshoot;
    secondLabel.textContent = '房產（急售通常需折價）';
    secondVal.textContent = fmtMoney(Math.max(0, houseValue - houseOvershoot));
    secondWrap.classList.add('show');
  } else {
    // 有股票但已完全扣完，且無房產
    secondLabel.textContent = '股票／基金（變現中）';
    secondVal.textContent = fmtMoney(0);
    secondWrap.classList.add('show');
  }
}

// 房屋現值估算：與情境 7（資產流動性危機）共用同一套簡化邏輯，
// 若使用者在該情境的進階面板調整過現值，優先採用調整後的數字
function getAssumedHouseValue(){
  if(household.houseStatus === 'none') return 0;
  const liqOv = overrides['liquidity_crisis'];
  if(liqOv && liqOv.assumedHouseValue !== undefined && liqOv.assumedHouseValue > 0) return liqOv.assumedHouseValue;
  return Math.round(household.mortgageRemaining*1.6/500000)*500000 || 6000000;
}

function bindScrollTankSync(){
  const stage = document.getElementById('stage-story');
  const progressBar = document.getElementById('storyProgress');
  window.addEventListener('scroll', ()=>{
    if(!stage.classList.contains('active')) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const pct = h>0 ? clamp(window.scrollY/h,0,1) : 0;
    progressBar.style.width = (pct*100)+'%';
  }, {passive:true});
}

/* ---- 進階調整面板 ---- */
function buildAdjustPanel(){
  const sc = CONFIG.scenarios[currentScenarioId];
  const wrap = document.getElementById('adjustFields');
  wrap.innerHTML = '';
  const ov = overrides[currentScenarioId];

  if(sc.types){
    const row = document.createElement('div'); row.className='adjust-field';
    row.innerHTML = `<label>選擇項目</label>`;
    const chipRow = document.createElement('div'); chipRow.className='chip-row';
    sc.types.forEach(t=>{
      const b = document.createElement('button'); b.type='button'; b.className='chip';
      b.style.color = '#fff'; b.style.borderColor='var(--night-line)'; b.style.background='rgba(255,255,255,.06)';
      const activeTypeId = ov.typeId || sc.defaults.typeId;
      if(t.id===activeTypeId){ b.style.background='var(--warm-candle)'; b.style.color='#241505'; }
      b.textContent = t.label;
      b.addEventListener('click', ()=>{ ov.typeId=t.id; delete ov.monthlyDrug; delete ov.lumpSum; recomputeStory(); buildAdjustPanel(); });
      chipRow.appendChild(b);
    });
    row.appendChild(chipRow);
    wrap.appendChild(row);
  }
  if(sc.careModes){
    const row = document.createElement('div'); row.className='adjust-field';
    row.innerHTML = `<label>照顧方式</label>`;
    const chipRow = document.createElement('div'); chipRow.className='chip-row';
    sc.careModes.forEach(t=>{
      const b = document.createElement('button'); b.type='button'; b.className='chip';
      b.style.color = '#fff'; b.style.borderColor='var(--night-line)'; b.style.background='rgba(255,255,255,.06)';
      const activeModeId = ov.careModeId || sc.defaults.careModeId;
      if(t.id===activeModeId){ b.style.background='var(--warm-candle)'; b.style.color='#241505'; }
      b.textContent = t.label;
      b.addEventListener('click', ()=>{ ov.careModeId=t.id; delete ov.careMonthly; recomputeStory(); buildAdjustPanel(); });
      chipRow.appendChild(b);
    });
    row.appendChild(chipRow);
    wrap.appendChild(row);
  }

  sc.advancedParams.forEach(p=>{
    let currentVal = ov[p.key];
    if(currentVal === undefined){
      currentVal = sc.defaults[p.key];
      if(currentVal === undefined && p.key==='monthlyDrug'){ const t=sc.types.find(t=>t.id===(ov.typeId||sc.defaults.typeId)); currentVal=t.monthly; }
      if(currentVal === undefined && p.key==='lumpSum'){ const t=sc.types.find(t=>t.id===(ov.typeId||sc.defaults.typeId)); currentVal=t.amount; }
      if(currentVal === undefined && p.key==='careMonthly'){ const t=sc.careModes.find(t=>t.id===(ov.careModeId||sc.defaults.careModeId)); currentVal=t.monthly; }
      if(currentVal === undefined && p.key==='educationPerChildPerYear') currentVal = CONFIG.general.educationPerChildPerYear;
      if(currentVal === undefined && p.key==='livingCostRatio') currentVal = CONFIG.general.livingCostRatio;
      if(currentVal === undefined && p.key==='assumedHouseValue') currentVal = household.houseStatus!=='none' ? Math.round(household.mortgageRemaining*1.6/500000)*500000 : 0;
    }
    const field = document.createElement('div'); field.className='adjust-field';
    field.innerHTML = `<label>${p.label} <span class="av">${p.percent ? Math.round(currentVal*100)+'%' : fmtMoney(currentVal)}</span></label>
      <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${currentVal}">`;
    const slider = field.querySelector('input');
    slider.addEventListener('input', (e)=>{
      const v = Number(e.target.value);
      ov[p.key] = v;
      field.querySelector('.av').textContent = p.percent ? Math.round(v*100)+'%' : fmtMoney(v);
      recomputeStory();
    });
    wrap.appendChild(field);
  });
}

function recomputeStory(){
  storyModel = buildModel(currentScenarioId, overrides[currentScenarioId]);
  // 就地更新文字內容，避免整頁重繪打斷閱讀節奏
  document.querySelectorAll('.chapter--thatday .amount').forEach(el=>{ el.dataset.count = storyModel.thatDay.firstCost; el.textContent = fmtMoney(storyModel.thatDay.firstCost); });
  document.querySelector('.chapter--thatday .lede').textContent = storyModel.thatDay.text;
  const nodeEls = document.querySelectorAll('.timeline-node');
  nodeEls.forEach((el,i)=>{
    const n = storyModel.timelineNodes[i];
    if(!n) return;
    el.querySelector('.tnum').textContent = n.tnum;
    el.querySelector('.tnote').textContent = n.note;
    const monthIdx = clamp(n.month, 0, storyModel.series.values.length-1);
    const savingsAtMonth = storyModel.series.values[monthIdx];
    const savingsEl = el.querySelector('.savings-val');
    if(savingsEl){
      savingsEl.textContent = savingsAtMonth<=0 ? '已歸零' : fmtMoney(savingsAtMonth);
      savingsEl.classList.toggle('zero', savingsAtMonth<=0);
    }
  });
  const formulaEl = document.querySelector('.count-formula');
  if(formulaEl && storyModel.countFormula) formulaEl.innerHTML = storyModel.countFormula;
  const familyEls = document.querySelectorAll('.family-item .ftext');
  familyEls.forEach((el,i)=>{ if(storyModel.family[i]) el.textContent = storyModel.family[i].text; });
  document.querySelector('.chapter--ending .final-line').textContent = storyModel.ending;
  // C4：進階調整後，水位停留在業務員目前滾動到的月份，不跳回開頭
  updateTank(lastViewedMonth);
}

document.getElementById('btnAdjust').addEventListener('click', ()=>{
  document.getElementById('adjustPanel').classList.toggle('open');
  document.getElementById('adjustScrim').classList.toggle('show');
});
document.getElementById('adjustScrim').addEventListener('click', ()=>{
  document.getElementById('adjustPanel').classList.remove('open');
  document.getElementById('adjustScrim').classList.remove('show');
});
document.getElementById('btnBackToScenarios').addEventListener('click', ()=>{
  goToStage('stage-scenarios'); renderScenarioGrid();
});

/* ==========================================================================
   舞台切換
   ========================================================================== */
function goToStage(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('dark', id==='stage-story');
  window.scrollTo(0,0);
}

/* ==========================================================================
   初始化
   ========================================================================== */
refreshSetupUI();
</script>
